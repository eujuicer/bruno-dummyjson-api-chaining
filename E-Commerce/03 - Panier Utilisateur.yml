info:
  name: 03 - Panier Utilisateur
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/carts/user/{{user_id}}"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.carts[0].id
        method: jsonq
      variable:
        name: cart_id
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.carts[0].products[0].id
        method: jsonq
      variable:
        name: product_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
