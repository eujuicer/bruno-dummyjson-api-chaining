http:
  method: GET
  url: "{{baseUrl}}/products/{{product_id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();

        test("Statut 200", () => {
          expect(res.getStatus()).to.equal(200);
        });

        bru.setVar("product_category", data.category);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
