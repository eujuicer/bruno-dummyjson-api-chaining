info:
  name: 02 - Profil Utilisateur
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/{{user_id}}"
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.address.city
        method: jsonq
      variable:
        name: user_city
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
