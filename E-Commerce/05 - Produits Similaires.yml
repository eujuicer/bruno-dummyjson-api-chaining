info:
  name: 05 - Produits Similaires
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/products/category/{{product_category}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();

        test("Au moins un produit retourné et bonne catégorie", () => {
          expect(data.products.length).to.be.greaterThan(0);
          expect(data.products[0].category).to.equal(bru.getVar("product_category"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
