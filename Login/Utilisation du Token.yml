info:
  name: Utilisation du Token
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();

        test("Status 200 et données utilisateur valides", () => {
          expect(res.getStatus()).to.equal(200);
          expect(data.firstName).to.equal("Emily");
          expect(data.email).to.include("@");
          expect(data.role).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
