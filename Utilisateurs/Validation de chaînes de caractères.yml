info:
  name: Validation de chaînes de caractères
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users/1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let d = res.getBody();

        test("id est un nombre", function() {
          expect(typeof d.id).to.equal('number');
        });

        test("age est supérieur à 18", function() {
          expect(d.age).to.be.above(18);
        });

        test("Le numéro de téléphone a un format valide", function() {
          let phoneRegex = /^[0-9\-\+\s\(\).]+$/;
          expect(phoneRegex.test(d.phone)).to.be.true;
        });
  assertions:
    - expression: res.body.firstName
      operator: eq
      value: Emily
    - expression: res.body.role
      operator: contains
      value: admin

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
