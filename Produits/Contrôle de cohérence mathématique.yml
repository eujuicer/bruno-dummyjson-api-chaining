info:
  name: Contrôle de cohérence mathématique
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/products/1"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let p = res.getBody();

        test("discountPercentage est cohérent (entre 0 et 50)", function() {
          expect(p.discountPercentage).to.be.above(0);
          expect(p.discountPercentage).to.be.below(50);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
