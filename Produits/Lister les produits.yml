info:
  name: Lister les produits
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/products"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        res.getBody().products.forEach(p => {
          if (p.stock < 0) {
            console.error("Stock invalide pour " + p.title);
          }
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
